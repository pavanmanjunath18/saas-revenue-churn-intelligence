name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check — scripts
        run: |
          python -m py_compile scripts/generate_mock_data.py
          python -m py_compile scripts/load_data.py
          python -m py_compile scripts/validate_generated_data.py

      - name: Syntax check — dashboard
        run: |
          python -m py_compile dashboards/streamlit_app.py
          python -m py_compile dashboards/db.py
          python -m py_compile dashboards/style.py
          python -m py_compile dashboards/pages/01_Revenue_Overview.py
          python -m py_compile dashboards/pages/02_MRR_Waterfall.py
          python -m py_compile dashboards/pages/03_Churn_Analysis.py
          python -m py_compile dashboards/pages/04_Cohort_Retention.py
          python -m py_compile dashboards/pages/05_Customer_Health.py

      - name: Generate synthetic data
        run: python scripts/generate_mock_data.py

      - name: Validate generated dataset
        run: python scripts/validate_generated_data.py

      - name: Run data quality tests
        run: pytest tests/test_data_quality.py -v
