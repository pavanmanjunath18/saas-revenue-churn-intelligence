name: SaaS Revenue & Churn CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Verify Python Code Compilation
      run: |
        python -m py_compile scripts/generate_mock_data.py
        python -m py_compile scripts/load_data.py
        python -m py_compile scripts/validate_generated_data.py
        python -m py_compile scripts/build_analytics.py
        python -m py_compile dashboards/streamlit_app.py

    - name: Run Synthetic Data Generation
      run: |
        python scripts/generate_mock_data.py

    - name: Validate Generated Dataset
      run: |
        python scripts/validate_generated_data.py
